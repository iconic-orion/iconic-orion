<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="ring" viewBox="0 0 32 32">
      <path d="M16,16 L16,2 A14,14 0 0,1 25.899,6.101 Z" fill="#eb894a"/>
      <path d="M16,16 L25.899,6.101 A14,14 0 0,1 30,16 Z" fill="#db7e97"/>
      <path d="M16,16 L30,16 A14,14 0 0,1 25.899,25.899 Z" fill="#b65b3d"/>
      <path d="M16,16 L25.899,25.899 A14,14 0 0,1 16,30 Z" fill="#ee665e"/>
      <path d="M16,16 L16,30 A14,14 0 0,1 6.101,25.899 Z" fill="#d19456"/>
      <path d="M16,16 L6.101,25.899 A14,14 0 0,1 2,16 Z" fill="#7fc275"/>
      <path d="M16,16 L2,16 A14,14 0 0,1 6.101,6.101 Z" fill="#dfa850"/>
      <path d="M16,16 L6.101,6.101 A14,14 0 0,1 16,2 Z" fill="#6ebdab"/>
      <circle cx="16" cy="16" r="6" fill="#0e0d10"/>
    </symbol>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d8a657" stop-opacity="0.18"/>
      <stop offset="55%"  stop-color="#d8a657" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d8a657" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="400" fill="#0e0d10"/>
  <circle cx="360" cy="200" r="250" fill="url(#glow)"/>
  <circle cx="360" cy="200" r="162" fill="none" stroke="#8a8579" stroke-opacity="0.42"
          stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"/>
  <use href="#ring" x="210" y="50" width="300" height="300"/>

  <!-- brand eyebrow -->
  <text x="592" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="25"
        font-weight="600" letter-spacing="6" fill="#d8a657">ICONIC-ORION</text>

  <!-- tool wordmark (the domain you own; lowercase, generic-safe) -->
  <text x="590" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="90"
        font-weight="700" letter-spacing="-2"><tspan fill="#e9e6df">aromawheel</tspan><tspan fill="#d8a657">.net</tspan></text>

  <!-- descriptor -->
  <text x="594" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="27"
        font-weight="400" fill="#8a8579">A place to record what you taste &amp; smell.</text>

  <!-- context -->
  <text x="594" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="24"
        font-weight="600" letter-spacing="0.5" fill="#e9e6df">Prototype <tspan fill="#8a8579">&#8212;</tspan> <tspan fill="#d8a657">your feedback shapes it.</tspan></text>
</svg>
