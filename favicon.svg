<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- dark background -->
  <circle cx="16" cy="16" r="16" fill="#1d1b17"/>
  <!-- 9 equal wedges (40° each), the wheel's scent-family ring. Order matches
       GROUPS: fruity, floral, roasted, spice, nutty, earthy, sweet, fermented,
       vegetal. Each path: M center, L outer-start, arc to outer-end, L center.
       Outer radius = 14, inner hub radius = 6 (leaves a dark center circle). -->

  <!-- fruity #eb894a    0°–40° -->
  <path d="M16,16 L16,2 A14,14 0 0,1 24.999,5.276 Z" fill="#eb894a"/>
  <!-- floral #db7e97   40°–80° -->
  <path d="M16,16 L24.999,5.276 A14,14 0 0,1 29.787,13.570 Z" fill="#db7e97"/>
  <!-- roasted #b65b3d  80°–120° -->
  <path d="M16,16 L29.787,13.570 A14,14 0 0,1 28.124,23.000 Z" fill="#b65b3d"/>
  <!-- spice #ee665e   120°–160° -->
  <path d="M16,16 L28.124,23.000 A14,14 0 0,1 20.788,29.156 Z" fill="#ee665e"/>
  <!-- nutty #d19456   160°–200° -->
  <path d="M16,16 L20.788,29.156 A14,14 0 0,1 11.212,29.156 Z" fill="#d19456"/>
  <!-- earthy #7fc275  200°–240° -->
  <path d="M16,16 L11.212,29.156 A14,14 0 0,1 3.876,23.000 Z" fill="#7fc275"/>
  <!-- sweet #dfa850   240°–280° -->
  <path d="M16,16 L3.876,23.000 A14,14 0 0,1 2.213,13.570 Z" fill="#dfa850"/>
  <!-- fermented #6ebdab 280°–320° -->
  <path d="M16,16 L2.213,13.570 A14,14 0 0,1 7.001,5.276 Z" fill="#6ebdab"/>
  <!-- vegetal #5a9c4f  320°–360° -->
  <path d="M16,16 L7.001,5.276 A14,14 0 0,1 16,2 Z" fill="#5a9c4f"/>

  <!-- dark hub — punches out the center to match the wheel's hollow ring look -->
  <circle cx="16" cy="16" r="6" fill="#1d1b17"/>
</svg>
