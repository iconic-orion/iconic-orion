<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- dark background -->
  <circle cx="16" cy="16" r="16" fill="#0e0d10"/>
  <!-- Thin ring of 9 stroked arcs (fill:none), matching how the real wheel
       draws its group-arc ring — a thick stroke on a thin annulus centerline,
       not a solid pie wedge to center. The app's own ring sits dim/muted at
       rest and "blooms" (brighter + glow) once a family has evidence; this is
       a static snapshot of that bloomed state, not the generic full-color
       pie-wedge look (which is the actual wine/flavor aroma wheel's specific
       visual signature — deliberately avoided here). Order matches GROUPS:
       fruity, floral, roasted, spice, nutty, earthy, sweet, fermented,
       vegetal. Fruity + roasted are "lit"; the rest sit dim, same ratio as
       the app's real rest-state opacity. -->
  <defs>
    <filter id="glow-fruity" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-roasted" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- fruity #eb894a — lit -->
  <path d="M 16.183 2.001 A 14 14 0 0 1 24.858 5.159"
        fill="none" stroke="#eb894a" stroke-width="6.94" stroke-linecap="butt" opacity="1" filter="url(#glow-fruity)"/>
  <!-- floral #db7e97 -->
  <path d="M 25.139 5.394 A 14 14 0 0 1 29.754 13.389"
        fill="none" stroke="#db7e97" stroke-width="6.20" stroke-linecap="butt" opacity="0.34"/>
  <!-- roasted #b65b3d — lit -->
  <path d="M 29.818 13.750 A 14 14 0 0 1 28.215 22.841"
        fill="none" stroke="#b65b3d" stroke-width="6.94" stroke-linecap="butt" opacity="1" filter="url(#glow-roasted)"/>
  <!-- spice #ee665e -->
  <path d="M 28.032 23.158 A 14 14 0 0 1 20.960 29.092"
        fill="none" stroke="#ee665e" stroke-width="6.20" stroke-linecap="butt" opacity="0.34"/>
  <!-- nutty #d19456 -->
  <path d="M 20.616 29.217 A 14 14 0 0 1 11.384 29.217"
        fill="none" stroke="#d19456" stroke-width="6.20" stroke-linecap="butt" opacity="0.34"/>
  <!-- earthy #7fc275 -->
  <path d="M 11.040 29.092 A 14 14 0 0 1 3.968 23.158"
        fill="none" stroke="#7fc275" stroke-width="6.20" stroke-linecap="butt" opacity="0.34"/>
  <!-- sweet #dfa850 -->
  <path d="M 3.785 22.841 A 14 14 0 0 1 2.182 13.750"
        fill="none" stroke="#dfa850" stroke-width="6.20" stroke-linecap="butt" opacity="0.34"/>
  <!-- fermented #6ebdab -->
  <path d="M 2.246 13.389 A 14 14 0 0 1 6.861 5.394"
        fill="none" stroke="#6ebdab" stroke-width="6.20" stroke-linecap="butt" opacity="0.34"/>
  <!-- vegetal #5a9c4f -->
  <path d="M 7.142 5.159 A 14 14 0 0 1 15.817 2.001"
        fill="none" stroke="#5a9c4f" stroke-width="6.20" stroke-linecap="butt" opacity="0.34"/>
</svg>
